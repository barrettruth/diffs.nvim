name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  format:
    name: Format
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: nix develop --command just format

  lint:
    name: Lint
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: nix develop --command just lint

  test:
    name: Test
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: nix develop --command just test
